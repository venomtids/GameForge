<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>GameForge · Jogo exportado</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #202a30;
        color: #d8eee0;
        font: 14px system-ui;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 24px;
        left: 24px;
        border: 1px solid #6e9d8055;
        background: #162a20dd;
        padding: 16px 22px;
        border-radius: 8px;
        z-index: 2;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #a3c5b0;
        margin: 4px 0;
      }
      button {
        margin-top: 10px;
        background: #87d3ad;
        border: 0;
        border-radius: 4px;
        padding: 7px 12px;
        cursor: pointer;
        color: #163524;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        background: #15251adb;
        place-items: center;
        z-index: 20;
        text-align: center;
      }
      @media (max-width: 760px) {
        #hud {
          top: max(12px, env(safe-area-inset-top));
          left: 12px;
          right: 12px;
          padding: 12px 14px;
        }
        h1 {
          font-size: 16px;
        }
        p {
          font-size: 11px;
          line-height: 1.5;
        }
        #hud button {
          min-height: 36px;
        }
        #overlay {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1 id="title">GameForge</h1>
      <p>
        WASD / setas: mover · Espaço: pular · Shift: correr · R: checkpoint ·
        Esc: pausar
      </p>
      <p id="score"></p>
      <p id="event"></p>
      <button id="restart">Reiniciar</button>
    </div>
    <div id="overlay">
      <div>
        <h1>Pausado</h1>
        <button id="resume">Continuar</button>
      </div>
    </div>
    <script id="project-data" type="application/octet-stream">
      __GAMEFORGE_PROJECT_DATA__
    </script>
    <script type="module" src="/src/player.ts"></script>
