name: Instalador GORE FORGE (Windows)
on:
  push:
    branches: [arena/4e96fac9-gameforge]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goreforge-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Empacotar, instalar e validar o GORE FORGE
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Versão do aplicativo
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Dependências
        run: npm ci
      - name: Testes da engine e do jogo
        run: npm test
      - name: Instalador leve (arquivo único) e sua validação
        run: |
          npm run installer:goreforge
          npm run test:installer:goreforge
      - name: Build do jogo e instalador NSIS (Electron)
        run: npm run desktop:goreforge
      - name: Validar jogo no aplicativo empacotado
        shell: pwsh
        env:
          GOREFORGE_TEST_APP: dist/goreforge-desktop
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          npm run test:electron:goreforge 2>&1 | Tee-Object -FilePath test-results\electron-empacotado.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar o próprio Setup.exe (silencioso) e validar o executável instalado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          pwsh -NoProfile -File scripts/instalar-e-verificar-goreforge.ps1 -Pacote dist/windows-goreforge *>&1 |
            Tee-Object -FilePath test-results\instalador.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Jogar a partir do aplicativo INSTALADO
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          npm run test:electron:goreforge 2>&1 | Tee-Object -FilePath test-results\electron-instalado.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desinstalar e conferir que saiu do sistema
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/desinstalar-e-verificar-goreforge.ps1 *>&1 |
            Tee-Object -FilePath test-results\desinstalador.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Eco do log: instalador NSIS"
        if: always()
        shell: pwsh
        run: |
          $arquivo = "test-results\instalador.log"
          if (-not (Test-Path $arquivo)) { Write-Host "::notice title=instalador NSIS::(sem log)"; exit 0 }
          $linhas = Get-Content $arquivo
          # 10 anotacoes por passo e o limite do GitHub: mostramos o que interessa
          $interessantes = $linhas | Where-Object { $_ -match "(?i)(error|erro|falha|falhou|fail|exception|AssertionError|ParserError|TypeError|nao encontrado|not found)" } | Select-Object -Last 6
          $cauda = $linhas | Select-Object -Last 4
          foreach ($linha in ($interessantes + $cauda | Select-Object -Unique)) {
            $limpo = ($linha -replace '%','%25') -replace "`r?`n",' '
            if ($limpo.Trim()) { Write-Host "::error title=instalador NSIS::[$nome_arquivo] $limpo" }
          }
          exit 0
      - name: "Eco do log: jogo no app INSTALADO"
        if: always()
        shell: pwsh
        run: |
          $arquivo = "test-results\electron-instalado.log"
          if (-not (Test-Path $arquivo)) { Write-Host "::notice title=jogo no app INSTALADO::(sem log)"; exit 0 }
          $linhas = Get-Content $arquivo
          # 10 anotacoes por passo e o limite do GitHub: mostramos o que interessa
          $interessantes = $linhas | Where-Object { $_ -match "(?i)(error|erro|falha|falhou|fail|exception|AssertionError|ParserError|TypeError|nao encontrado|not found)" } | Select-Object -Last 6
          $cauda = $linhas | Select-Object -Last 4
          foreach ($linha in ($interessantes + $cauda | Select-Object -Unique)) {
            $limpo = ($linha -replace '%','%25') -replace "`r?`n",' '
            if ($limpo.Trim()) { Write-Host "::error title=jogo no app INSTALADO::[$nome_arquivo] $limpo" }
          }
          exit 0
      - name: "Eco do log: desinstalador"
        if: always()
        shell: pwsh
        run: |
          $arquivo = "test-results\desinstalador.log"
          if (-not (Test-Path $arquivo)) { Write-Host "::notice title=desinstalador::(sem log)"; exit 0 }
          $linhas = Get-Content $arquivo
          # 10 anotacoes por passo e o limite do GitHub: mostramos o que interessa
          $interessantes = $linhas | Where-Object { $_ -match "(?i)(error|erro|falha|falhou|fail|exception|AssertionError|ParserError|TypeError|nao encontrado|not found)" } | Select-Object -Last 6
          $cauda = $linhas | Select-Object -Last 4
          foreach ($linha in ($interessantes + $cauda | Select-Object -Unique)) {
            $limpo = ($linha -replace '%','%25') -replace "`r?`n",' '
            if ($limpo.Trim()) { Write-Host "::error title=desinstalador::[$nome_arquivo] $limpo" }
          }
          exit 0
      - name: Entregar instalador, checksum e instruções
        uses: actions/upload-artifact@v4
        with:
          name: GORE-FORGE-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            dist/windows-goreforge/*-Setup.exe
            dist/windows-goreforge/SHA256SUMS.txt
            dist/windows-goreforge/LEIA-ME-WINDOWS.txt
            dist/windows-goreforge/GORE-FORGE-Instalador.cmd
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publicar download da prévia Windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "goreforge-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "dist/windows-goreforge/GORE-FORGE-$version-Windows-x64-Setup.exe" "dist/windows-goreforge/SHA256SUMS.txt" "dist/windows-goreforge/LEIA-ME-WINDOWS.txt" "dist/windows-goreforge/GORE-FORGE-Instalador.cmd" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GORE FORGE $version — Windows x64" --prerelease --notes-file "packaging/NOTAS-GOREFORGE-$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Evidências e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validacao-GOREFORGE-Windows-${{ steps.version.outputs.version }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
